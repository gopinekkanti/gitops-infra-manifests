apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com'
    targetRevision: HEAD
    path: infrastructure/manifests/kubeflow
  destination:
    server: 'https://default.svc'
    namespace: kubeflow # Deploys directly into the ML platform namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # Creates kubeflow namespace if missing
